plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdkVersion 36

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lintOptions {                                                                  
      checkReleaseBuilds false                                                     
    } 

//    packagingOptions {
//        pickFirst 'lib/x86/libc++_shared.so'
//        pickFirst 'lib/x86_64/libc++_shared.so'
//        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
//        pickFirst 'lib/arm64-v8a/libc++_shared.so'
//    }

    namespace 'com.sacombank.cmv'

//    ndkVersion "28.2.13676358"
    defaultConfig {
        applicationId "com.sacombank.sbatdg"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
//        ndk.abiFilters 'armeabi-v7a', 'arm64-v8a'
        multiDexEnabled true

        manifestPlaceholders = [applicationName: "com.sacombank.cmv.SBAApplication"]

//        externalNativeBuild {
//            cmake {
//                cppFlags "-Wl,-z,max-page-size=16384"
//            }
//        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    aaptOptions {
        noCompress "bic"
    }

    flavorDimensions "default"
    productFlavors {
        pro {
            dimension "default"
            resValue "string", "app_name", "SBA TDG"
            applicationIdSuffix ""
        }
        dev {
            dimension "default"
            resValue "string", "app_name", "SBA TDG Dev"
            applicationIdSuffix ".dev"
        }
        uat {
            dimension "default"
            resValue "string", "app_name", "SBA TDG UAT"
            applicationIdSuffix ".uat"
        }

    }

    lintOptions {
        checkReleaseBuilds false
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.0"
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.3.2"
    implementation platform('com.google.firebase:firebase-bom:28.4.2')

    implementation files('libs/ekyc_sdk-release-v3.6.6.aar')
    implementation files('libs/scanqr_ic_sdk-release-v1.0.6.aar')
    implementation files('libs/sdk_vnpt_smartca_library-release.aar')
    // implementation files('libs/vnpt_smartca_sdk_lib-release.aar')
    compileOnly files('libs/eContract-v3.1.0.aar')

    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.annotation:annotation:1.7.0"

    implementation "com.auth0.android:jwtdecode:2.0.0"
    implementation "com.github.gcacace:signature-pad:1.3.1"
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.9.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"

    implementation "androidx.test.espresso:espresso-idling-resource:3.5.1"
    implementation "com.github.mhiew:android-pdf-viewer:3.2.0-beta.3"

    implementation "com.squareup.okhttp3:okhttp:4.10.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.10.0"
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.retrofit2:adapter-rxjava2:2.9.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "com.karumi:dexter:6.0.0"

    implementation "androidx.exifinterface:exifinterface:1.3.6"
    implementation 'com.google.code.gson:gson:2.9.0'

    implementation "io.reactivex.rxjava2:rxandroid:2.1.1"
    implementation "io.reactivex.rxjava2:rxjava:2.2.12"
    implementation "com.google.android.play:app-update-ktx:2.1.0"
    implementation "de.hdodenhof:circleimageview:3.1.0"
    implementation "com.intuit.sdp:sdp-android:1.1.0"
    implementation('me.dm7.barcodescanner:zxing:1.9.8') {
        exclude group: 'com.android.support'
    }

    implementation "androidx.core:core:1.9.0"
    implementation "org.bouncycastle:bcpkix-jdk15on:1.67"
    implementation "com.airbnb.android:lottie:5.0.1"
}
